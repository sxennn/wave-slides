<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wave Slides</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;700;800&display=swap");
    :root{--bg:#101418;--panel:#171d23;--panel-alt:#1b232b;--text:#e9eef4;--muted:#a8b3bf;--accent:#ffb703;--line:rgba(255,255,255,.08);--danger:#ff6b6b}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:"Bricolage Grotesque","Segoe UI",sans-serif}body{min-height:100vh;padding:24px}button,textarea{font:inherit}button:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px;box-shadow:0 0 0 4px rgba(255,183,3,.2)}
    .app{max-width:1200px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1.65fr) minmax(320px,.85fr);gap:24px;align-items:stretch}.slide-panel,.side-panel{background:rgba(23,29,35,.88);border:1px solid var(--line);border-radius:22px;box-shadow:0 18px 40px rgba(0,0,0,.28)}.slide-panel{position:relative;min-height:680px;overflow:hidden;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#13181d,#101418)}.slide-viewport{position:relative;width:100%;height:100%;min-height:680px;display:flex;align-items:center;justify-content:center;padding:48px 60px;overflow:hidden;isolation:isolate}.swipe-flash{position:absolute;top:0;bottom:0;width:14px;opacity:0;pointer-events:none;z-index:3;background:linear-gradient(180deg,rgba(255,183,3,.9),rgba(255,183,3,.65));box-shadow:0 0 18px rgba(255,183,3,.35)}.swipe-flash.left{left:0;border-radius:0 10px 10px 0}.swipe-flash.right{right:0;border-radius:10px 0 0 10px}.swipe-flash.show{animation:flashBar 420ms ease-out}@keyframes flashBar{0%{opacity:0;transform:scaleY(.2)}18%{opacity:1;transform:scaleY(1)}100%{opacity:0;transform:scaleY(.25)}}.slide-content{position:relative;z-index:2;max-width:760px;text-align:center;line-height:1.12;font-size:clamp(2rem,3vw,4.2rem);font-weight:700;letter-spacing:-.04em;word-break:break-word;text-wrap:balance;user-select:none}.slide-count{position:absolute;bottom:28px;right:30px;z-index:2;font-size:.92rem;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}.slide-count strong{color:var(--accent);font-weight:700}.side-panel{padding:20px;display:flex;flex-direction:column;gap:16px}.camera-box{background:var(--panel-alt);border:1px solid var(--line);border-radius:18px;overflow:hidden;position:relative}.camera-header{display:flex;align-items:center;justify-content:space-between;padding:10px 12px 0}.camera-status{background:rgba(255,183,3,.12);color:var(--accent);border:1px solid rgba(255,183,3,.3);border-radius:999px;padding:6px 10px;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;font-weight:700}.camera-wrap{position:relative;margin-top:8px;width:100%;aspect-ratio:4/3;background:#0a0d10;border-radius:12px;overflow:hidden;border:1px solid var(--line)}video,canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}video{transform:scaleX(-1);background:#0a0d10}canvas{z-index:1;pointer-events:none}.camera-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.button-row{display:flex;gap:10px;flex-wrap:wrap}button{border:1px solid rgba(255,255,255,.12);background:var(--panel-alt);color:var(--text);border-radius:12px;padding:10px 14px;cursor:pointer;transition:transform .12s ease,border-color .12s ease,background .12s ease}button:hover{border-color:rgba(255,183,3,.4);background:#1d2a35}button:active{transform:translateY(1px)}.primary{background:var(--accent);color:#11161a;border-color:transparent;font-weight:700}.primary:hover{background:#ffc93f}.ghost{background:transparent}.editor-box{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:10px}textarea{width:100%;min-height:220px;resize:vertical;border-radius:14px;border:1px solid var(--line);background:rgba(12,16,20,.78);color:var(--text);padding:14px 16px;line-height:1.5;font-size:.96rem}.camera-error{min-height:20px;margin-top:8px;color:var(--danger);font-size:.9rem;line-height:1.35}@media(max-width:820px){body{padding:16px}.app{grid-template-columns:1fr}.slide-panel,.slide-viewport{min-height:460px}.slide-viewport{padding:36px 28px}}
  </style>
</head>
<body>
  <div class="app">
    <section class="slide-panel"><div id="slideViewport" class="slide-viewport" aria-live="polite"><div id="swipeFlashLeft" class="swipe-flash left"></div><div id="swipeFlashRight" class="swipe-flash right"></div><div id="slideText" class="slide-content">Ready to present</div><div class="slide-count"><strong id="slideCounter">1 / 1</strong></div></div></section>
    <aside class="side-panel">
      <div class="camera-box"><div class="camera-header"><span class="camera-status" id="cameraStatus">Camera off</span></div><div class="camera-wrap"><video id="video" autoplay playsinline muted></video><canvas id="overlayCanvas"></canvas></div><div class="camera-actions"><button id="startCameraBtn" class="primary" type="button">Start camera</button><button id="stopCameraBtn" class="ghost" type="button">Stop camera</button></div><div id="cameraError" class="camera-error" aria-live="polite"></div></div>
      <div class="button-row"><button id="prevBtn" type="button">Previous</button><button id="nextBtn" type="button">Next</button><button id="fullscreenBtn" type="button">Fullscreen</button></div>
      <div class="editor-box"><textarea id="slidesInput" spellcheck="false"></textarea><button id="updateSlidesBtn" class="primary" type="button">Update slides</button></div>
    </aside>
  </div>
  <script type="module">
    import {FilesetResolver,HandLandmarker} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/vision_bundle.js";
    const $=id=>document.getElementById(id), slideViewport=$("slideViewport"), slideText=$("slideText"), slideCounter=$("slideCounter"), cameraStatus=$("cameraStatus"), video=$("video"), canvas=$("overlayCanvas"), cameraError=$("cameraError"), leftFlash=$("swipeFlashLeft"), rightFlash=$("swipeFlashRight");
    const connections=[[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[0,17],[17,18],[18,19],[19,20]];
    const defaultSlides=["Welcome to Wave Slides","Swipe with an open palm to move through your deck","Use your laptop camera to control the presentation","Arrow keys and space also work","You can edit your slides anytime"];
    const state={slides:[],index:0,stream:null,landmarker:null,cameraOn:false,lastSwipe:0,trail:[]};
    function render(){slideText.textContent=state.slides[state.index]||"No slides yet";slideCounter.textContent=`${state.slides.length?state.index+1:0} / ${state.slides.length}`}
    function parse(){state.slides=$("slidesInput").value.trim().split(/\n\s*\n/).map(x=>x.replace(/\s+/g," ").trim()).filter(Boolean);if(!state.slides.length)state.slides=defaultSlides.slice();state.index=Math.min(state.index,state.slides.length-1);render()}
    function move(delta){state.index=Math.max(0,Math.min(state.index+delta,state.slides.length-1));render()}
    function status(text){cameraStatus.textContent=text}
    function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y,a.z-b.z)}
    function openPalm(h){return [[4,3],[8,6],[12,10],[16,14],[20,18]].every(([tip,mid])=>dist(h[tip],h[0])>dist(h[mid],h[0])+.015)}
    function flash(el){el.classList.remove("show");void el.offsetWidth;el.classList.add("show")}
    function swipe(direction){const now=performance.now();if(now-state.lastSwipe<900)return;state.lastSwipe=now;move(direction<0?1:-1);flash(direction<0?rightFlash:leftFlash)}
    function gesture(h,w,now){if(!h){status("Show your hand");state.trail=[];return}if(!openPalm(h)){status("Show your hand");state.trail=[];return}const x=h[9].x*w;state.trail.push({x,time:now});while(state.trail.length>1&&now-state.trail[0].time>450)state.trail.shift();if(state.trail.length>=3){const delta=x-state.trail[0].x;if(Math.abs(delta)>w*.28){swipe(delta);state.trail=[];return}}status("Open palm: swipe now")}
    function draw(h){const w=video.videoWidth||640,hgt=video.videoHeight||480;canvas.width=w;canvas.height=hgt;const ctx=canvas.getContext("2d");ctx.clearRect(0,0,w,hgt);if(!h)return;ctx.strokeStyle="#ffb703";ctx.fillStyle="#ffb703";ctx.lineWidth=3;for(const [a,b] of connections){ctx.beginPath();ctx.moveTo(h[a].x*w,h[a].y*hgt);ctx.lineTo(h[b].x*w,h[b].y*hgt);ctx.stroke()}for(const p of h){ctx.beginPath();ctx.arc(p.x*w,p.y*hgt,4.5,0,Math.PI*2);ctx.fill()}}
    async function initModel(){if(state.landmarker)return;const vision=await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/wasm");state.landmarker=await HandLandmarker.createFromOptions(vision,{baseOptions:{modelAssetPath:"https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker.task"},runningMode:"VIDEO",numHands:1})}
    async function start(){try{cameraError.textContent="";if(!navigator.mediaDevices?.getUserMedia)throw Error("unsupported");await initModel();state.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user"},audio:false});video.srcObject=state.stream;await video.play();state.cameraOn=true;status("Show your hand");const loop=()=>{if(!state.cameraOn)return;if(video.readyState>=2){const now=performance.now(),result=state.landmarker.detectForVideo(video,now),hand=result.landmarks?.[0]||null;draw(hand);gesture(hand,video.videoWidth,now)}requestAnimationFrame(loop)};requestAnimationFrame(loop)}catch(e){console.error(e);stop();cameraError.textContent="Camera access was blocked or unavailable. Please allow webcam access and try again."}}
    function stop(){state.cameraOn=false;if(state.stream)state.stream.getTracks().forEach(t=>t.stop());state.stream=null;video.srcObject=null;canvas.getContext("2d").clearRect(0,0,canvas.width,canvas.height);state.trail=[];status("Camera off")}
    $("startCameraBtn").onclick=start;$("stopCameraBtn").onclick=stop;$("prevBtn").onclick=()=>move(-1);$("nextBtn").onclick=()=>move(1);$("updateSlidesBtn").onclick=parse;$("fullscreenBtn").onclick=()=>document.fullscreenElement?document.exitFullscreen():slideViewport.requestFullscreen();
    document.addEventListener("keydown",e=>{if(document.activeElement?.tagName==="TEXTAREA")return;if(["ArrowLeft","PageUp"].includes(e.key)){e.preventDefault();move(-1)}else if(["ArrowRight","PageDown"," "].includes(e.key)){e.preventDefault();move(1)}});
    $("slidesInput").value=defaultSlides.join("\n\n");parse();
  </script>
</body>
</html>
